<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>把图片压到指定大小 · 在线免费</title>
<meta name="description" content="输入目标大小，把图片压到刚好卡线。批量处理，顺序不乱。文件不上传。">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/common.css">
</head>
<body>

<div class="topbar">
  <div class="wrap"><a class="back" href="../index.html">‹ 返回</a><h1>压到指定大小</h1></div>
</div>

<div class="wrap">
  <div class="hero">
    <h2>告诉它多少 K，它压到刚好卡线</h2>
    <p>很多网站要求「不超过 200K」「不超过 1M」。选好图，填上数字就行。</p>
  </div>

  <div class="drop" id="drop">
    <div class="big">点这里选图片</div>
    <div class="sub">也可以直接把图片拖进来 · 支持一次选多张</div>
    <input type="file" id="file" accept="image/*" multiple>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="field">
      <label>压到多大以内</label>
      <div class="chips" id="chips">
        <button class="chip" data-k="100">100K</button>
        <button class="chip on" data-k="200">200K</button>
        <button class="chip" data-k="500">500K</button>
        <button class="chip" data-k="1024">1M</button>
        <button class="chip" data-k="2048">2M</button>
      </div>
      <div class="hint">1M = 1024K。不确定就选 200K，大部分网站够用。</div>
    </div>
    <div class="field">
      <label>或者自己填一个数（K）</label>
      <input type="number" id="target" value="200" min="10" max="20480" step="10" inputmode="numeric">
      <div class="hint">比如对方要求「不超过 512KB」，就填 512。</div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="btn-row" id="actions" style="display:none">
    <button class="btn ghost" id="clear">清空</button>
    <button class="btn" id="go">开始压缩</button>
  </div>
  <div class="btn-row" id="actions2" style="display:none">
    <button class="btn" id="download">全部下载</button>
  </div>

  <div class="status" id="status"></div>

  <footer>
    <p><span class="safe">图片没有离开你的设备。</span>压缩是在你手机（或电脑）的浏览器里算完的，中间没有服务器。</p>
    <p>这个工具不保存、不上传、不收集。关掉页面就什么都不剩。</p>
  </footer>
</div>

<script>
(function(){
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const actions = document.getElementById('actions');
  const actions2 = document.getElementById('actions2');
  const targetInput = document.getElementById('target');
  const chips = document.getElementById('chips');

  let files = [];      // {file, url, outBlob, outName, done}
  let busy = false;

  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    [...chips.children].forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    targetInput.value = b.dataset.k;
  });
  targetInput.addEventListener('input', () => {
    [...chips.children].forEach(c => c.classList.toggle('on', Number(c.dataset.k) === Number(targetInput.value)));
  });

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  function addFiles(incoming) {
    const imgs = incoming.filter(f => f.type.startsWith('image/'));
    if (!imgs.length) return;
    for (const f of imgs) {
      files.push({ file: f, url: URL.createObjectURL(f), outBlob: null, outName: null, done: false });
    }
    render();
    setStatus('');
  }

  document.getElementById('clear').addEventListener('click', () => {
    if (busy) return;
    files.forEach(f => URL.revokeObjectURL(f.url));
    files = [];
    render();
    setStatus('');
  });

  function fmt(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' K';
    return (bytes / 1024 / 1024).toFixed(2) + ' M';
  }

  function render() {
    listEl.innerHTML = '';
    files.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'item';
      const k = targetInput.value || '200';
      let sizeHtml = '';
      if (f.outBlob) {
        const ok = f.outBlob.size <= Number(k) * 1024;
        sizeHtml = `<span class="${ok ? '' : 'over'}">${fmt(f.file.size)} → <b>${fmt(f.outBlob.size)}</b>${ok ? '' : ' （还是超了）'}</span>`;
      } else if (f.done) {
        sizeHtml = `<span class="over">${fmt(f.file.size)} → 压不到 ${k}K</span>`;
      } else {
        sizeHtml = fmt(f.file.size);
      }
      div.innerHTML = `
        <img class="thumb" src="${f.url}" alt="">
        <div class="meta">
          <div class="name">${escapeHtml(f.file.name)}</div>
          <div class="size">${sizeHtml}</div>
        </div>
        <button class="x" data-i="${i}" aria-label="移除">×</button>`;
      listEl.appendChild(div);
    });
    listEl.querySelectorAll('.x').forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      const i = Number(b.dataset.i);
      URL.revokeObjectURL(files[i].url);
      files.splice(i, 1);
      render();
    }));
    actions.style.display = files.length ? 'flex' : 'none';
    actions2.style.display = files.some(f => f.outBlob) ? 'flex' : 'none';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function setStatus(msg, bad) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (bad ? ' bad' : '');
  }

  // ---- 核心：压到目标字节以内，尽量保持尺寸，先降质量，不够再缩尺寸 ----
  async function encodeAt(bitmap, w, h, q) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bitmap, 0, 0, w, h);
    return await new Promise(res => canvas.toBlob(res, 'image/jpeg', q));
  }

  async function compressTo(bitmap, targetBytes) {
    const ow = bitmap.width, oh = bitmap.height;

    // 第一轮：原尺寸，先试 0.8
    const first = await encodeAt(bitmap, ow, oh, 0.8);
    if (!first) return null;

    if (first.size <= targetBytes) {
      // 达标了，往上找能达标的最高质量
      let best = first, lo = 0.8, hi = 0.97;
      for (let i = 0; i < 4; i++) {
        const mid = (lo + hi) / 2;
        const b = await encodeAt(bitmap, ow, oh, mid);
        if (!b) break;
        if (b.size <= targetBytes) { best = b; lo = mid; } else { hi = mid; }
        if (hi - lo < 0.03) break;
      }
      return best;
    }

    // 原尺寸超标：质量往下二分
    let best = null, lo = 0.25, hi = 0.8;
    for (let i = 0; i < 6; i++) {
      const mid = (lo + hi) / 2;
      const b = await encodeAt(bitmap, ow, oh, mid);
      if (!b) break;
      if (b.size <= targetBytes) { best = b; lo = mid; } else { hi = mid; }
      if (hi - lo < 0.02) break;
    }
    if (best) return best;

    // 质量降到 0.25 还不够：缩尺寸，一次一轮
    let scale = Math.min(0.88, Math.sqrt(targetBytes / first.size) * 0.95);
    for (let round = 0; round < 8; round++) {
      const w = Math.round(ow * scale);
      const h = Math.round(oh * scale);
      if (Math.max(w, h) < 120) break;
      const b = await encodeAt(bitmap, w, h, 0.8);
      if (!b) return null;
      if (b.size <= targetBytes) return b;
      scale *= 0.8;
    }
    return null;
  }

  async function loadBitmap(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
      try { return await createImageBitmap(file); } catch (e) {}
    }
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }

  document.getElementById('go').addEventListener('click', async () => {
    if (busy) return;
    if (!files.length) return;
    const k = Number(targetInput.value);
    if (!k || k < 10) { setStatus('目标大小填一个至少 10K 的数。', true); return; }

    busy = true;
    actions2.style.display = 'none';
    const targetBytes = k * 1024;
    let ok = 0, fail = 0;

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      setStatus(`正在处理第 ${i + 1} / ${files.length} 张…`);
      try {
        const bmp = await loadBitmap(f.file);
        const out = await compressTo(bmp, targetBytes);
        if (out) {
          f.outBlob = out;
          const base = f.file.name.replace(/\.[^.]+$/, '');
          f.outName = base + '.jpg';
          ok++;
        } else {
          f.done = true; fail++;
        }
        if (bmp.close) bmp.close();
      } catch (e) {
        f.done = true; fail++;
      }
      render();
      await new Promise(r => setTimeout(r, 0));
    }

    busy = false;
    setStatus(
      fail ? `完成 ${ok} 张，${fail} 张压不到 ${k}K（原图可能已经很小，或者尺寸太大）。` : `全部压好了，${ok} 张都在 ${k}K 以内。`,
      fail > 0
    );
    render();
  });

  // ---- ZIP（不压缩存储，JPEG 已经压过）----
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function dosTime(d) {
    return ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  }
  function dosDate(d) {
    return (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  }
  function makeZip(entries) {
    const enc = new TextEncoder();
    const chunks = [], central = [];
    let offset = 0;
    const now = new Date();
    for (const e of entries) {
      const nameBytes = enc.encode(e.name);
      const data = e.data;
      const crc = crc32(data);
      const lh = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime(now), true);
      dv.setUint16(12, dosDate(now), true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      chunks.push(lh, data);

      const ch = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime(now), true);
      cv.setUint16(14, dosDate(now), true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);

      offset += lh.length + data.length;
    }
    const centralOffset = offset;
    let centralSize = 0;
    for (const c of central) { chunks.push(c); centralSize += c.length; }
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, central.length, true);
    ev.setUint16(10, central.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, centralOffset, true);
    chunks.push(eocd);
    return new Blob(chunks, { type: 'application/zip' });
  }

  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  document.getElementById('download').addEventListener('click', async () => {
    const done = files.filter(f => f.outBlob);
    if (!done.length) return;
    if (done.length === 1) {
      saveBlob(done[0].outBlob, done[0].outName);
      setStatus('已保存。');
      return;
    }
    setStatus('正在打包…');
    const entries = [];
    for (let i = 0; i < done.length; i++) {
      const buf = new Uint8Array(await done[i].outBlob.arrayBuffer());
      const num = String(i + 1).padStart(2, '0');
      entries.push({ name: num + '_' + done[i].outName, data: buf });
    }
    const zip = makeZip(entries);
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    saveBlob(zip, `压缩好的图片_${stamp}.zip`);
    setStatus('打包好了，看一下手机的「下载」里。');
  });

})();
</script>
</body>
</html>
