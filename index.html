<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>免费在线小工具 · 文件不上传</title>
<meta name="description" content="图片压到指定大小、图片转PDF、多图拼长图。全部在你自己手机里处理，不上传、不注册、不收费。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/common.css?v=2">
</head>
<body>

<div class="topbar">
  <div class="wrap"><h1>小工具</h1></div>
</div>

<div class="wrap">

  <div class="hero">
    <h2>文件不出你的手机</h2>
    <p>不注册、不收费、不限次数。打开就能用，用完关掉。</p>
  </div>

  <div class="homelist">

    <a class="tool" href="tools/img-compress.html">
      <div class="body">
        <div class="t">把图片压到指定大小</div>
        <div class="d">告诉它你要多少 KB，它压到刚好卡线。批量也行，顺序不会乱。</div>
        <span class="tag">办证、传资料最常用</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="tool" href="tools/img2pdf.html">
      <div class="body">
        <div class="t">多张图片合成一个 PDF</div>
        <div class="d">拍好的照片按顺序排成一个 PDF，A4 或原图尺寸都行。</div>
        <span class="tag">交材料、发简历</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="tool" href="tools/stitch.html">
      <div class="body">
        <div class="t">多张图拼成一张长图</div>
        <div class="d">上面拼下面，或者左边拼右边。画质不掉，顺序自己拖。</div>
        <span class="tag">聊天记录、流程说明</span>
      </div>
      <span class="arrow">›</span>
    </a>

  </div>

  <div class="notice" style="margin-top:22px">
    这些工具都在你自己设备的浏览器里算，文件不会发到任何服务器。断网也能用。<br>
    原理：所有处理都在页面里完成，没有后端。
  </div>

  <footer>
    <p><span class="safe">不上传 · 不要账号 · 不收钱</span></p>
    <p>用到不好用的地方，麻烦告诉我哪一步卡住了。</p>
  </footer>

</div>
</body>
</html>
